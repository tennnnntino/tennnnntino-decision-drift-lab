name: verify-synthetic-lab
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout isolated public demonstration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Declare toolchain versions
        run: |
          python3 --version
          node --version
      - name: Run Python and Node synthetic checks
        run: python3 -m unittest discover -s tests -q
      - name: Run deterministic reference benchmark
        run: python3 -m ddlab benchmark
      - name: Verify 100 generated regressions
        run: python3 -m ddlab challenge --summary-only
      - name: Independent Node regression runner
        run: node --test tests/v12-browser-logic.test.mjs tests/v13-challenge.test.mjs tests/v14-contracts.test.mjs
      - name: Validate synthetic handoff corpus and reproduce the results snapshot
        run: |
          python3 -m ddlab corpus validate
          python3 -m ddlab corpus snapshot | cmp - research/handoff-benchmark-v1_4-results.json
      - name: Reproduce the ProofPack and check generated modules
        run: |
          python3 -m ddlab proofpack | cmp - research/proofpack-v1_4.json
          python3 tools/build_policy_module.py --check
          python3 tools/build_walkthrough_case.py --check
